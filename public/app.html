 g:'<svg viewBox="0 0 48 48" aria-hidden="true" class="gl"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>'};
const afld=(id,lbl,ic,type,ac,extra="")=>`<label for="${id}">${lbl}</label><div class="af">${IC[ic]}<input id="${id}" type="${type}" autocomplete="${ac}" ${extra}>${type==="password"?`<button type="button" class="eye" data-eye="${id}" aria-label="Show password">${IC.eye}</button>`:""}</div>`;
const gbtn=t=>AU.google?`<a class="gbtn" href="/auth/google">${IC.g}<span>${t}</span></a><div class="or"><span>OR</span></div>`:"";
const AUTHERR={google_failed:"Google sign-in didn't work. Please try again.",google_taken:"That email already has an account. Sign in with your password."};
function authView(v,msg){const L=$("#lk"),tk=new URLSearchParams(location.search).get("token")||"";AU.v=v;
 const card=(h,sub,body,foot)=>`<div class="au"><h1>${h}</h1><p class="sub">${sub}</p>${body}<p id="au-m" class="am" role="alert">${msg?E(msg):""}</p>${foot?`<p class="foot">${foot}</p>`:""}</div>`;
 const go=(t,id="au-go")=>`<button class="ab" id="${id}" type="submit">${t} ${IC.arr}</button>`;
 let h;
 if(v==="signup")h=card("Create your account","Start your free trial. No card needed.",`${gbtn("Sign up with Google")}<form id="au-f" novalidate>${afld("a-n","Your name","user","text","name",'maxlength="80"')}${afld("a-c","Clinic name","home","text","organization",'maxlength="120"')}${afld("a-e","Email address","mail","email","email",'maxlength="254" autocapitalize="none"')}${afld("a-p","Password (8+ characters)","lock","password","new-password",'maxlength="200"')}${go("Create account")}</form>`,`Already have an account? <a href="/" data-av="login">Sign in</a>`);
 else if(v==="forgot")h=card("Forgot password?","Enter the email you signed up with and we'll send you a link to reset your password.",`<form id="au-f" novalidate>${afld("a-e","Email address","mail","email","email",'maxlength="254" autocapitalize="none"')}${go("Send reset link")}</form>`,`<a href="/" data-av="login">Back to sign in</a>`);
 else if(v==="sent")h=card("Check your email",`If an account exists for <b>${E(AU.sentTo||"")}</b>, we've sent a link to reset your password. It expires in 1 hour. Check your spam folder if you don't see it.`,"",`<a href="/" data-av="login">Back to sign in</a>`);
 else if(v==="reset")h=tk?card("Set a new password","Choose a new password for your account.",`<form id="au-f" novalidate>${afld("a-p","New password (8+ characters)","lock","password","new-password",'maxlength="200"')}${afld("a-p2","Confirm new password","lock","password","new-password",'maxlength="200"')}${go("Update password")}</form>`,`<a href="/" data-av="login">Back to sign in</a>`)
  :card("Link not valid","This reset link is incomplete. Please request a new one.","",`<a href="/forgot" data-av="forgot">Request a new link</a>`);
 else h=card("Welcome back","Sign in to your clinic dashboard",`${gbtn("Continue with Google")}<form id="au-f" novalidate>${afld("a-e","Email address","mail","text","username",'maxlength="254" autocapitalize="none" spellcheck="false"')}${afld("a-p","Password","lock","password","current-password",'maxlength="200"')}<div class="fg"><a href="/forgot" data-av="forgot">Forgot password?</a></div>${go("Sign in")}</form>`,`Don't have an account? <a href="/signup" data-av="signup"><b>Sign Up Free</b></a>`);
 L.innerHTML=h;L.classList.add("on","authbg");document.body.classList.add("lk");
 const f=$("#au-f");if(f){f.onsubmit=e=>{e.preventDefault();authGo()};const first=f.querySelector("input");if(first)first.focus()}}
const authMsg=t=>{$("#au-m").textContent=t};
async function authGo(){const v=AU.vals=AU.v,b=$("#au-go"),val=id=>($("#"+id)||{}).value||"";authMsg("");
 try{b.disabled=true;
  if(v==="login"){if(!val("a-e").trim()||!val("a-p"))return authMsg("Enter your email and password.");await api("POST","/api/login",{username:val("a-e").trim(),password:val("a-p")})}
  else if(v==="signup"){if(val("a-p").length<8)return authMsg("Choose a password of 8 or more characters.");await api("POST","/api/signup",{name:val("a-n"),clinic:val("a-c"),email:val("a-e").trim(),password:val("a-p")})}
  else if(v==="forgot"){const em=val("a-e").trim();if(!em)return authMsg("Enter your email address.");await api("POST","/api/forgot",{email:em});AU.sentTo=em;return authView("sent")}
  else if(v==="reset"){if(val("a-p").length<8)return authMsg("Choose a password of 8 or more characters.");if(val("a-p")!==val("a-p2"))return authMsg("The two passwords don't match.");
   await api("POST","/api/reset",{token:new URLSearchParams(location.search).get("token")||"",password:val("a-p")})}
  history.replaceState(null,"","/");$("#lk").classList.remove("authbg");await enter()}
 catch(e){authMsg(e.message)}finally{b.disabled=false}}

 const y=e.target.closest("[data-eye]");if(y){const i=$("#"+y.dataset.eye),sh=i.type==="password";i.type=sh?"text":"password";y.setAttribute("aria-label",sh?"Hide password":"Show password");y.classList.toggle("on",sh)}});

 AU.google=st.google;const ae=new URLSearchParams(location.search).get("auth");if(ae)history.replaceState(null,"",location.pathname);
 authView(pathView(),AUTHERR[ae]||"")}
boot().catch(e=>{$("#lk").innerHTML=`<div class="card"><h2>Cannot reach the server</h2><p>${E(e.message)}</p></div>`;$("#lk").classList.add("on")});
