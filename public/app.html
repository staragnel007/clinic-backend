const csvParse=t=>{const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===","){row.push(f);f=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;row.push(f);f="";r.push(row);row=[]}else f+=ch}if(f||row.length){row.push(f);r.push(row)}return r.filter(x=>x.some(c=>c.trim()))};
