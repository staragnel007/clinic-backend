<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPD Desk</title>
<style>
:root{--bg:#f6f3ee;--grad:#fbe8df;--card:#fff;--ink:#14231c;--mut:#6c7b73;--line:#e4e8e3;--pri:#1a5c3f;--pi:#fff;--soft:#e6f1ea;--bad:#b3261e;--warn:#9a6700;--ok:#1f9d55}
@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--grad:#1a2420;--card:#18231d;--ink:#e6efe9;--mut:#93a89c;--line:#2a3a31;--pri:#47b583;--pi:#06210f;--soft:#183328;--bad:#f2837c;--warn:#e3b341;--ok:#47b583;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(var(--grad),var(--bg) 300px) no-repeat,var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body.lk header,body.lk main{display:none}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{display:flex;gap:12px;align-items:center;color:inherit;text-decoration:none}.brand b{display:block;letter-spacing:.3px}.brand small{color:var(--mut)}
.logo{width:42px;height:42px;border-radius:10px;background:var(--pri);color:var(--pi);display:grid;place-items:center;font-weight:700}
header nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}header nav a,header nav button{color:inherit;text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:4px}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}h1{margin:0 0 4px;font-size:26px}h2{margin:0 0 12px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px}
.stat span,.lbl{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut)}.stat b{display:block;font-size:34px;line-height:1.2;color:var(--pri)}.stat.k b{color:var(--ink)}
.panel{padding:0;overflow:hidden}.panel .top{padding:16px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.cols>*{padding:16px 20px;border-right:1px solid var(--line);color:inherit;text-decoration:none;background:none;border-top:0;border-bottom:0;border-left:0;text-align:left;font:inherit;cursor:pointer}.cols b{display:block;font-size:30px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:60px;resize:vertical}
.btn{background:var(--pri);color:var(--pi);border:1px solid var(--pri);padding:9px 16px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}
.btn.o{background:var(--card);color:var(--pri);border-color:var(--pri)}.btn.s{background:var(--soft);color:var(--ink);border-color:var(--soft);font-weight:500;padding:5px 11px;font-size:13px}.btn.x{background:none;border:0;color:var(--bad);padding:5px}
.lnk{background:none;border:0;color:var(--pri);cursor:pointer;font:inherit;padding:0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}th{font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);font-weight:600}
.r{text-align:right}.mut{color:var(--mut)}.hide{display:none!important}.bad{color:var(--bad);font-weight:600}.ok{color:var(--ok)}.nw{white-space:nowrap}.mono{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--pri);font-weight:600}
.chip{background:var(--soft);color:var(--pri);border-radius:20px;padding:3px 12px;font-size:15px;font-weight:600;vertical-align:middle}
.crumb{color:var(--mut);margin-bottom:12px}.crumb a,.back{color:var(--pri);text-decoration:none}.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:14px 0 18px}.tabs a{padding:12px 24px;color:var(--mut);text-decoration:none;border-bottom:2px solid transparent}.tabs a.on{color:var(--pri);border-color:var(--pri)}
.visit{border:1px solid var(--line);border-radius:12px;margin-top:14px;overflow:hidden}.vh{display:flex;gap:12px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.vh>div{flex:1}.num{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:700}
.vb{padding:6px 18px}.vb p{margin:10px 0}.vf{display:flex;justify-content:space-between;padding:12px 18px;font-size:14px}
details.dd{position:relative;display:inline-block}details.dd summary{cursor:pointer;color:var(--ok);font-weight:600;list-style:none;padding:4px 8px}details.dd summary::-webkit-details-marker{display:none}
.menu{position:absolute;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:6;min-width:200px;padding:4px}.menu a{display:block;padding:8px 12px;color:inherit;text-decoration:none;border-radius:6px}.menu a:hover{background:var(--soft)}
.bar{height:10px;border-radius:5px;background:var(--pri);min-width:2px}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);overflow:auto;padding:20px 12px;z-index:20}#mb{max-width:640px;margin:0 auto;background:var(--card);border-radius:14px;padding:22px}#mb.wide{max-width:780px}
#mb .mbar{display:flex;gap:8px;margin-bottom:12px}#doc{background:#fff;color:#111;padding:24px;border-radius:6px;font-size:14px}#doc table{width:100%}#doc th,#doc td{border-bottom:1px solid #ccc;color:#111;padding:6px}#doc th{color:#444}
#doc .hd{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}#doc .hd b{font-size:20px}#doc .rx{font-size:28px;font-weight:700;margin:10px 0 4px}#doc .sig{margin-top:56px;text-align:right}
#lk{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;align-items:center;justify-content:center;padding:16px}#lk.on{display:flex}#lk .card{width:100%;max-width:380px;margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:50}
.scard{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 28px;margin-bottom:16px;cursor:pointer;font:inherit;color:inherit}.scard:hover{border-color:var(--pri)}
.g1{display:grid;gap:12px}.hr{border:0;border-top:1px solid var(--line);margin:18px 0}.pv{width:90px;height:90px;border-radius:10px;background:var(--bg);display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:26px}.pv img{max-width:100%;max-height:100%}
.swb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;font:inherit;color:inherit;text-align:center}.swb.on{border:2px solid var(--pri);background:var(--soft)}.swb i{display:inline-block;width:20px;height:20px;border-radius:50%;margin:0 3px 6px}
.rad{display:block;margin:6px 0;font-size:14px;color:var(--ink)}.rad input{width:auto;margin-right:8px}.card h3{margin:20px 0 10px}
@media print{body>*:not(#md){display:none!important}#md{position:static;background:none;padding:0}#mb{max-width:none;padding:0}.mbar{display:none!important}#doc{padding:0}}
</style></head><body class="lk">
<header id="hd" class="hide"></header><main id="app"></main>
<div id="md" class="hide"><div id="mb"></div></div><div id="lk"></div><div id="toast" class="hide"></div>
<script src="/qrcode.js"></script>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={clinic:{},patients:[],appts:[],rx:[],bills:[],visits:[],regs:[],users:[],doctors:[]},ME=null,meds=[],items=[],PRE="",F={q:"",f:"",t:"",n:50};
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),td=()=>iso(new Date()),add=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return iso(x)};
const fd=d=>d?d.split("-").reverse().join("/"):"",fdl=d=>d?new Date(d+"T00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
const M=n=>"₹"+(+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2}),M0=n=>"₹"+(+n||0).toLocaleString("en-IN",{maximumFractionDigits:2});
const flash=m=>{const e=$("#toast");e.textContent=m;e.classList.remove("hide");clearTimeout(flash.t);flash.t=setTimeout(()=>e.classList.add("hide"),2800)};
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","X-Requested-With":"opd"},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&ME){location.reload();throw new Error("Session ended")}if(!r.ok)throw new Error(j.error||"Request failed");return j};
const put=(c,d)=>api("PUT",`/api/${c}/${encodeURIComponent(d.id)}`,d),post=(c,d)=>api("POST","/api/"+c,d);
window.addEventListener("unhandledrejection",e=>flash((e.reason&&e.reason.message)||"Something went wrong"));
const isDoc=()=>ME&&ME.role==="doctor",clin=()=>S.clinic.name||"Clinic",dr=()=>S.clinic.doctor?"Dr. "+S.clinic.doctor.replace(/^Dr\.?\s*/i,""):"";
const P=id=>S.patients.find(p=>p.id===id),PN=id=>(P(id)||{name:"(removed)"}).name,paid=b=>b.pays.reduce((s,p)=>s+p.a,0),due=b=>b.t-paid(b);
const PH=p=>p?`+91 ${p.slice(0,5)} ${p.slice(5)}`:"",wa=(ph,t)=>`https://wa.me/91${ph}${t?"?text="+encodeURIComponent(t):""}`;
const fld=(id,l,v="",t="text",x="")=>`<div><label>${l}</label><input id="${id}" type="${t}" value="${E(v)}" ${x}></div>`,tav=(id,l,v="")=>`<div><label>${l}</label><textarea id="${id}">${E(v)}</textarea></div>`;
const selv=(id,l,o,v)=>`<div><label>${l}</label><select id="${id}">${o.map(x=>`<option${x===v?" selected":""}>${x}</option>`).join("")}</select></div>`;
const bt=(a,id,t,c="s",x="")=>`<button class="btn ${c}" data-a="${a}" data-id="${id}" ${x}>${t}</button>`,rows=(a,e,n=5)=>a.length?a.join(""):`<tr><td colspan="${n}" class="mut">${e}</td></tr>`;
const BG=["Unknown","A+","A-","B+","B-","AB+","AB-","O+","O-"],g=i=>($("#"+i)?$("#"+i).value.trim():""),psel=v=>`<option value="">Select patient</option>`+S.patients.map(p=>`<option value="${p.id}"${p.id===v?" selected":""}>${p.id} – ${E(p.name)} (${E(p.ph)})</option>`).join("");
const modal=(h,w)=>{$("#mb").className=w?"wide":"";$("#mb").innerHTML=h;$("#md").classList.remove("hide")},closeM=()=>$("#md").classList.add("hide");
const show=(h,w)=>modal(`<div class="mbar"><button class="btn" data-a="print">Print</button>${w?`<a class="btn o" target="_blank" rel="noopener" href="${w}">Send on WhatsApp</a>`:""}<button class="btn s" data-a="close">Close</button></div><div id="doc">${h}</div>`,1);

/* printable documents */
let TC="#1a5c3f";const DEFREV="Hi {name},\n\nThank you for visiting our clinic. We'd love to hear your feedback! Please take a moment to leave us a Google review:\n\n{link}";
const TH=[["Ocean Teal","#1a5c3f","#e6f1ea",["#0d9488","#14b8a6","#f0fdfa"]],["Sage Green","#4d6b3a","#eaf0e4",["#5f7f4a","#a8b89a","#f6f6f4"]],["Midnight Blue","#1e3a5f","#e3ebf6",["#1e3a5f","#3b82f6","#0b1220"]],["Charcoal Slate","#374151","#e5e7eb",["#374151","#9ca3af","#111827"]],["Classic Gold","#a16207","#fef3c7",["#eab308","#ca8a04","#fefce8"]]];
const applyTheme=n=>{const t=TH.find(x=>x[0]===(n||S.clinic.theme))||TH[0];TC=t[1];const r=document.documentElement.style;if(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches){r.removeProperty("--pri");r.removeProperty("--soft")}else{r.setProperty("--pri",t[1]);r.setProperty("--soft",t[2])}};
const hdrHtml=(c=S.clinic)=>{if(c.lh)return `<img src="${c.lh}" alt="" style="width:100%;display:block;margin-bottom:10px">`;
 const fs={Small:12,Normal:14,Large:16}[c.txt]||14,ns={Small:18,Medium:24,Large:30}[c.nsize]||24,nm=E(c.name||"Clinic"),logo=c.logo?`<img src="${c.logo}" alt="" style="max-height:64px">`:"",tag=c.tag?`<div style="color:${TC};font-weight:600">${E(c.tag)}</div>`:"",d=c.doctor?"Dr. "+c.doctor.replace(/^Dr\.?\s*/i,""):"",
 ct=[d&&`<b>${E(d)}</b>`,c.qual&&E(c.qual),c.spec&&E(c.spec),c.reg&&"Reg. No: "+E(c.reg),c.phone&&E(c.phlabel||"Contact")+": "+E(c.phone),c.time&&`<b style="color:${TC}">${E(c.time)}</b>`].filter(Boolean).join("<br>"),
 ad=[c.addr,c.city,c.state,c.pin].filter(Boolean).map(E).join(", "),h=c.hdr||"centre",addr=ad?`<div style="font-size:${fs-2}px;color:#666;margin-top:6px">${ad}</div>`:"";
 if(h==="left")return `<div style="font-size:${fs}px;border-bottom:2px solid ${TC};padding-bottom:8px;margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start"><div style="display:flex;gap:10px;align-items:center">${logo}<div><div style="font-size:${ns}px;font-weight:700;color:${TC}">${nm}</div>${tag}</div></div><div style="text-align:right">${ct}</div></div>${addr}</div>`;
 if(h==="band")return `<div style="font-size:${fs}px;text-align:center;margin-bottom:12px"><div style="background:${TC};color:#fff;padding:10px;font-size:${ns}px;font-weight:700">${nm}${c.tag?`<div style="font-size:${fs}px;font-weight:400">${E(c.tag)}</div>`:""}</div><div style="padding-top:8px">${ct}</div>${addr}</div>`;
 return `<div style="font-size:${fs}px;text-align:center;border-bottom:2px solid ${TC};padding-bottom:8px;margin-bottom:12px">${logo}<div style="font-size:${ns}px;font-weight:700;color:${TC}">${nm}</div>${tag}<div style="margin-top:4px">${ct}</div>${addr}</div>`};
const dh=t=>hdrHtml()+`<h3 style="text-align:center;margin:0 0 10px">${t}</h3>`;
const sigHtml=()=>{const c=S.clinic,col=c.stampcol==="Black"?"#111":"#1d3a8a",ln=(c.stamp||"").split("\n").filter(Boolean);return `<div class="sig">${c.sig?`<img src="${c.sig}" alt="" style="max-height:60px;display:block;margin-left:auto">`:""}<div style="color:${col}">${E(dr())||"Doctor’s signature"}${c.sigstyle==="full"?`${c.qual?"<br>"+E(c.qual):""}${c.reg?"<br>Reg. No: "+E(c.reg):""}`:""}${ln.length?"<br>"+ln.map(E).join("<br>"):""}</div>${c.stampmode==="box"?'<div style="display:inline-block;width:90px;height:90px;border:1px dashed #999;margin-top:8px"></div>':""}</div>`};
const pl=(p,no,d)=>`<table><tr><td><b>${E(p.name)}</b>, ${E(p.age)} y / ${E(p.sex)}<br>${p.id} · ${E(PH(p.ph))}${p.al?"<br><b>Allergies:</b> "+E(p.al):""}</td><td class="r">${no}<br>Date: ${fd(d)}</td></tr></table>`;
const rxD=r=>{const p=P(r.pid)||{},v=[["Dx",r.dx]].filter(x=>x[1]);return dh("PRESCRIPTION")+pl(p,r.no,r.date)+(r.dx?`<p><b>Diagnosis:</b> ${E(r.dx)}</p>`:"")+`<div class="rx">℞</div><table><thead><tr><th>#</th><th>Medicine</th><th>Dose</th><th>Frequency</th><th>Duration</th><th>Instructions</th></tr></thead>${r.meds.map((m,i)=>`<tr><td>${i+1}</td><td>${E(m.n)}</td><td>${E(m.d)}</td><td>${E(m.f)}</td><td>${E(m.u)}</td><td>${E(m.i)}</td></tr>`).join("")}</table>${r.a?`<p><b>Advice:</b> ${E(r.a).replace(/\n/g,"<br>")}</p>`:""}${r.f?`<p><b>Follow-up:</b> ${fd(r.f)}</p>`:""}${sigHtml()}`};
const rxW=r=>wa((P(r.pid)||{}).ph,`*${clin()}*\nPrescription ${r.no} (${fd(r.date)})\nPatient: ${PN(r.pid)}\n${r.dx?"Diagnosis: "+r.dx+"\n":""}${r.meds.map((m,i)=>`${i+1}. ${m.n} ${m.d} ${m.f} ${m.u} ${m.i}`.replace(/ +/g," ")).join("\n")}${r.a?"\nAdvice: "+r.a:""}${r.f?"\nFollow-up: "+fd(r.f):""}`);
const bD=b=>{const pd=paid(b);return dh("INVOICE")+pl(P(b.pid)||{},b.no,b.date)+`<table style="margin-top:10px"><thead><tr><th>#</th><th>Service</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>${b.items.map((i,k)=>`<tr><td>${k+1}</td><td>${E(i.n)}</td><td class="r">${i.q}</td><td class="r">${M(i.r)}</td><td class="r">${M(i.q*i.r)}</td></tr>`).join("")}</table><table style="margin-top:8px;max-width:320px;margin-left:auto"><tr><td>Subtotal</td><td class="r">${M(b.s)}</td></tr>${b.d?`<tr><td>Discount</td><td class="r">− ${M(b.d)}</td></tr>`:""}<tr><td><b>Total</b></td><td class="r"><b>${M(b.t)}</b></td></tr><tr><td>Received</td><td class="r">${M(pd)}</td></tr><tr><td><b>Balance due</b></td><td class="r"><b>${M(b.t-pd)}</b></td></tr></table><p style="font-size:12px;margin-top:26px">Payments: ${b.pays.map(x=>fd(x.d)+" "+M(x.a)+" ("+x.m+")").join("; ")||"none"}</p>${S.clinic.billnote?`<p style="font-size:12px">${E(S.clinic.billnote)}</p>`:""}<div class="sig">Authorised signatory</div>`};
const bW=b=>wa((P(b.pid)||{}).ph,`*${clin()}*\nInvoice ${b.no} (${fd(b.date)})\n${b.items.map(i=>`${i.n} x${i.q}: ${M(i.q*i.r)}`).join("\n")}\nTotal: ${M(b.t)}\nReceived: ${M(paid(b))}\nBalance: ${M(due(b))}`);
const repD=p=>{const vs=S.visits.filter(v=>v.pid===p.id).sort((a,b)=>a.date<b.date?-1:1),bl=S.bills.filter(b=>b.pid===p.id);return dh("PATIENT REPORT")+pl(p,"",td())+`<p>${FORM().sections.flatMap(s=>s.f).filter(f=>!HEADF.includes(f.id)&&val(p,f)).map(f=>`<b>${E(f.l)}:</b> ${E(val(p,f))}`).join("<br>")}</p><table><thead><tr><th>Date</th><th>Complaint</th>${isDoc()?"<th>Diagnosis</th><th>Prescription</th>":""}</tr></thead>${rows(vs.map(v=>`<tr><td>${fd(v.date)}</td><td>${E(v.cc)}</td>${isDoc()?`<td>${E(v.dx)}</td><td>${E(v.rx)}</td>`:""}</tr>`),"No visits",4)}</table><p>Billed ${M(bl.reduce((s,b)=>s+b.t,0))} · Paid ${M(bl.reduce((s,b)=>s+paid(b),0))} · Due ${M(bl.reduce((s,b)=>s+due(b),0))}</p>${FORM().sig?`<div style="margin-top:30px"><span style="font-size:12px">Patient signature</span><br>${SIGC[p.id]?`<img src="${SIGC[p.id]}" alt="" style="max-height:60px">`:'<div style="width:220px;border-bottom:1px solid #111;height:50px"></div>'}</div>`:""}`};
const certD=(p,o)=>dh("MEDICAL CERTIFICATE")+`<p style="margin-top:24px;line-height:1.9">This is to certify that <b>${E(p.name)}</b>, aged ${E(p.age)} years, was examined at ${E(clin())} on ${fd(o.date)}${o.dx?` and diagnosed with <b>${E(o.dx)}</b>`:""}.${o.days?` The patient is advised rest for <b>${E(o.days)} day(s)</b> from ${fd(o.from)}.`:""}</p>${o.note?`<p>${E(o.note)}</p>`:""}<p style="text-align:right"><small>Date: ${fd(td())}</small></p>${sigHtml()}`;

/* routing and views */
const hdr=()=>{const n=clin();$("#hd").classList.remove("hide");$("#hd").innerHTML=`<a class="brand" href="#/"><span class="logo">${E(n.replace(/[^A-Za-z]/g,"").slice(0,2).toUpperCase()||"OP")}</span><span><b>${E(n.toUpperCase())}</b><small>${E(dr()||ME.name)}</small></span></a><nav><a href="#/appointments">Appointments</a><a href="#/analytics">Analytics</a>${isDoc()?'<a href="#/settings">Settings</a>':""}<a href="#/help">Help</a><button data-a="refresh" title="Refresh">↻</button><button data-a="out">Logout</button></nav>`};
