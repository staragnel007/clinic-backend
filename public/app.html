<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPD Desk</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#17261f;--mut:#667a70;--line:#dce5e0;--pri:#1f7a52;--pi:#fff;--soft:#e4f2ea;--bad:#b3261e;--warn:#9a6700;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1713;--card:#18231d;--ink:#e6efe9;--mut:#93a89c;--line:#2a3a31;--pri:#47b583;--pi:#06210f;--soft:#183328;--bad:#f2837c;--warn:#e3b341;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1713;--card:#18231d;--ink:#e6efe9;--mut:#93a89c;--line:#2a3a31;--pri:#47b583;--pi:#06210f;--soft:#183328;--bad:#f2837c;--warn:#e3b341;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{margin:0;font-size:18px}header small{color:var(--mut)}
nav{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:20px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.on{background:var(--pri);color:var(--pi);border-color:var(--pri)}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}
.k{background:var(--soft);border-radius:8px;padding:12px}.k b{display:block;font-size:22px}.k span{font-size:12px;color:var(--mut)}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:56px;resize:vertical}
.btn{background:var(--pri);color:var(--pi);border:0;padding:9px 16px;border-radius:6px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;display:inline-block}
.btn.s{background:var(--soft);color:var(--ink);font-weight:500;padding:5px 10px;font-size:13px}.btn.x{background:none;color:var(--bad);padding:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut);font-weight:600}
.r{text-align:right}.mut{color:var(--mut)}.hide{display:none}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}.ok{color:var(--pri);font-weight:600}.nw{white-space:nowrap}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);overflow:auto;padding:16px;z-index:20}
#ov .bar{max-width:760px;margin:0 auto 10px;display:flex;gap:8px;padding-top:env(safe-area-inset-top,0px)}
#doc{max-width:760px;margin:0 auto;background:#fff;color:#111;padding:26px;border-radius:6px;font-size:14px}
#doc table{width:100%}#doc th,#doc td{border-bottom:1px solid #ccc;color:#111}#doc th{color:#444}
#doc .hd{text-align:center;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:12px}#doc .hd b{font-size:20px}
#doc .rx{font-size:28px;font-weight:700;margin:10px 0 4px}#doc .sig{margin-top:56px;text-align:right}
#doc .btn.s{background:#e8e8e8;color:#111}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:30}
@media print{body>*:not(#ov){display:none!important}#ov{position:static;background:none;padding:0}#ov .bar{display:none}#doc{max-width:none;padding:0}}
body.lk header,body.lk main{display:none}#lk{display:none;position:fixed;inset:0;background:var(--bg);z-index:40;align-items:center;justify-content:center;padding:16px}#lk.on{display:flex}#lk .card{width:100%;max-width:380px;margin:0}
</style></head><body class="lk">
<header><button class="btn s" id="lockb" style="float:right">Sign out</button><h1 id="cn">OPD Desk</h1><small id="cd"></small><nav id="nav"></nav></header>
<main>
<section id="v-dash"></section><section id="v-appt" class="hide"></section><section id="v-pat" class="hide"></section>
<section id="v-rx" class="hide"></section><section id="v-bill" class="hide"></section><section id="v-rep" class="hide"></section><section id="v-set" class="hide"></section>
</main>
<div id="ov" class="hide"><div class="bar"><button class="btn s" id="o-x">Close</button><button class="btn" id="o-p">Print</button><a class="btn" id="o-w" target="_blank" rel="noopener">Send on WhatsApp</a></div><div id="doc"></div></div>
<div id="lk"></div><div id="toast" class="hide"></div>
<script src="/qrcode.js"></script>
<script>
const K="opd_desk_v2",$=s=>document.querySelector(s),E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={clinic:{},patients:[],appts:[],rx:[],bills:[],n:{p:0,r:0,b:0,a:0}},meds=[],items=[],eid=null;

let ME=null;
const api=async(m,u,b)=>{const r=await fetch(u,{method:m,headers:{"Content-Type":"application/json","X-Requested-With":"opd"},body:b?JSON.stringify(b):undefined}),j=await r.json().catch(()=>({}));if(r.status===401&&ME){location.reload();throw new Error("Session ended")}if(!r.ok)throw new Error(j.error||"Request failed");return j};
const put=(c,d)=>api("PUT",`/api/${c}/${encodeURIComponent(d.id)}`,d),sv=()=>0;
window.addEventListener("unhandledrejection",e=>flash((e.reason&&e.reason.message)||"Something went wrong"));
const M=n=>"₹"+(+n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),td=()=>iso(new Date()),add=(d,n)=>{const x=new Date(d+"T00:00");x.setDate(x.getDate()+n);return iso(x)};
const fd=d=>d?d.split("-").reverse().join("/"):"",pad=(p,n)=>p+String(n).padStart(4,"0");
const P=id=>S.patients.find(p=>p.id===id)||{id:"",name:"(removed)",ph:"",age:"",sex:""};
const paid=b=>b.pays.reduce((s,p)=>s+p.a,0),due=b=>b.t-paid(b),wa=(ph,t)=>`https://wa.me/91${ph}?text=${encodeURIComponent(t)}`;
const clin=()=>S.clinic.name||"Clinic",dr=()=>S.clinic.doctor?"Dr. "+S.clinic.doctor.replace(/^Dr\.?\s*/i,""):"";
const flash=m=>{const e=$("#toast");e.textContent=m;e.classList.remove("hide");setTimeout(()=>e.classList.add("hide"),2600)};
const fld=(id,l,t="text",x="")=>`<div><label>${l}</label><input id="${id}" type="${t}" ${x}></div>`;
const sel=(id,l,o)=>`<div><label>${l}</label><select id="${id}">${o.map(x=>`<option>${x}</option>`).join("")}</select></div>`;
const ta=(id,l)=>`<div><label>${l}</label><textarea id="${id}"></textarea></div>`;
const psel=()=>`<option value="">Select patient</option>`+S.patients.map(p=>`<option value="${p.id}">${p.id} – ${E(p.name)} (${E(p.ph)})</option>`).join("");
const btn=(a,id,t,c="")=>`<button class="btn s ${c}" data-a="${a}" data-id="${id}">${t}</button>`;
const link=(h,t)=>`<a class="btn s" target="_blank" rel="noopener" href="${h}">${t}</a>`;
const V=["dash","appt","pat","rx","bill","rep","set"],NM=["Today","Appointments","Patients","Prescription","Billing","Reports","Settings"];
$("#nav").innerHTML=V.map((v,i)=>`<button data-v="${v}">${NM[i]}</button>`).join("");
$("#nav").onclick=e=>e.target.dataset.v&&go(e.target.dataset.v);
function go(v){V.forEach(k=>$("#v-"+k).classList.toggle("hide",k!==v));document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));R[v]&&R[v]();$("#cn").textContent=clin();$("#cd").textContent=dr()||"Add your clinic details under Settings";scrollTo(0,0)}
const rows=(a,e)=>a.length?a.join(""):`<tr><td class="mut">${e}</td></tr>`;

/* static forms */
$("#v-appt").innerHTML=`<div class="card"><h2>Book appointment</h2><div class="g"><div><label>Patient *</label><select id="a-p"></select></div>${fld("a-d","Date","date")}${fld("a-t","Time","time")}${fld("a-n","Reason")}</div><div class="row"><button class="btn" id="a-s">Book</button></div></div><div class="card"><h2>Upcoming appointments</h2><div class="tbl"><table id="a-l"></table></div></div>`;
$("#v-pat").innerHTML=`<div class="card"><h2>Online registrations (<span id="rc"></span>)</h2><div class="tbl"><table id="reg-l"></table></div></div><div class="card"><h2 id="pt">Register new patient</h2><div class="g">${fld("p-name","Full name *")}${fld("p-age","Age (years) *","number",'min="0" max="120"')}${sel("p-sex","Sex",["Male","Female","Other"])}${fld("p-ph","Mobile *","tel",'maxlength="10"')}${sel("p-bg","Blood group",["Unknown","A+","A-","B+","B-","AB+","AB-","O+","O-"])}${fld("p-em","Guardian / Emergency contact")}</div><div class="g" style="margin-top:12px">${ta("p-ad","Address")}${ta("p-al","Known allergies")}${ta("p-hx","Medical history / notes")}</div><div class="row"><button class="btn" id="p-s">Save patient</button><button class="btn s hide" id="p-c">Cancel edit</button></div></div><div class="card"><h2>Patients (<span id="pc"></span>)</h2><input id="p-q" placeholder="Search by name, mobile or ID" style="margin-bottom:10px"><div class="tbl"><table id="p-l"></table></div></div>`;
$("#v-rx").innerHTML=`<div class="card"><h2>New prescription</h2><div class="g"><div><label>Patient *</label><select id="x-p"></select></div>${fld("x-d","Date","date")}${fld("x-bp","BP (mmHg)")}${fld("x-pu","Pulse (/min)")}${fld("x-t","Temp (°F)")}${fld("x-w","Weight (kg)")}</div><div class="g" style="margin-top:12px">${ta("x-c","Complaints")}${ta("x-dx","Diagnosis")}</div><h2 style="margin-top:14px">Medicines</h2><div class="tbl"><table><thead><tr><th>Medicine</th><th>Dose</th><th>Frequency</th><th>Duration</th><th>Instructions</th><th></th></tr></thead><tbody id="x-m"></tbody></table></div><div class="row"><button class="btn s" data-a="addm">+ Add medicine</button></div><div class="g" style="margin-top:12px">${ta("x-a","Advice / Investigations")}${fld("x-f","Follow-up on","date")}</div><div class="row"><button class="btn" id="x-s">Save &amp; preview</button></div></div><div class="card"><h2>Recent prescriptions</h2><div class="tbl"><table id="x-l"></table></div></div>`;
$("#v-bill").innerHTML=`<div class="card"><h2>New bill</h2><div class="g"><div><label>Patient *</label><select id="b-p"></select></div>${fld("b-d","Date","date")}${sel("b-m","Payment mode",["Cash","UPI","Card"])}</div><div class="tbl" style="margin-top:12px"><table><thead><tr><th>Service</th><th style="width:70px">Qty</th><th style="width:110px">Rate (₹)</th><th class="r" style="width:100px">Amount</th><th></th></tr></thead><tbody id="b-i"></tbody></table></div><div class="row"><button class="btn s" data-a="addi">+ Add item</button></div><div class="g" style="margin-top:12px;max-width:560px;margin-left:auto">${fld("b-ds","Discount (₹)","number",'min="0" value="0"')}${fld("b-r","Received now (₹)","number",'min="0" placeholder="Full amount"')}<div><label>Total</label><div id="b-t" style="font-size:22px;font-weight:700"></div></div></div><div class="row"><button class="btn" id="b-s">Save &amp; preview</button></div></div><div class="card"><h2>Recent bills</h2><div class="tbl"><table id="b-l"></table></div></div>`;
$("#v-set").innerHTML=`<div class="card"><h2>Clinic details (printed on documents)</h2><div class="g">${fld("c-name","Clinic name")}${fld("c-doctor","Doctor name")}${fld("c-qual","Qualification","text",'placeholder="MBBS, MD"')}${fld("c-reg","Registration no. (NMC / State)")}${fld("c-phone","Phone")}${fld("c-time","Timings")}</div><div style="margin-top:12px">${ta("c-addr","Address")}</div><div class="row"><button class="btn" id="c-s">Save details</button></div></div><div class="card"><h2>Backup &amp; export</h2><p class="mut" style="margin-top:0">Records are stored on the clinic server. Backup files you download are not encrypted, so keep them private.</p><div class="row"><button class="btn" data-a="bk">Download backup</button><button class="btn s" data-a="csvp">Patients CSV</button><button class="btn s" data-a="csvb">Bills CSV</button></div></div><div class="card"><h2>Patient registration QR</h2><p class="mut" style="margin-top:0">Patients scan the QR code and fill in a short form on their own phone. Their details arrive in the Online registrations box on the Patients tab, where you approve them. Save your clinic name above first.</p><div class="row"><button class="btn" data-a="qr">Show QR poster</button></div></div><div class="card"><h2>My password</h2><div class="g">${fld("pc-c","Current password","password")}${fld("pc-n","New password (8+ characters)","password")}</div><div class="row"><button class="btn s" data-a="pc">Change password</button></div></div><div class="card" id="usr"><h2>Doctors &amp; staff</h2><div class="tbl"><table id="u-l"></table></div><div class="g" style="margin-top:12px">${fld("u-n","Username")}${fld("u-f","Full name")}${sel("u-r","Role",["staff","doctor"])}${fld("u-p","Temporary password (8+)","password")}</div><div class="row"><button class="btn s" data-a="adu">Add user</button><span class="mut">Staff can register, book and bill, but cannot see prescriptions or settings.</span></div></div>`;

/* views */
const R={};
R.dash=()=>{const t=td(),ap=S.appts.filter(a=>a.date===t&&a.st!=="Cancelled").sort((a,b)=>a.time>b.time?1:-1),col=S.bills.reduce((s,b)=>s+b.pays.filter(p=>p.d===t).reduce((x,p)=>x+p.a,0),0),dueT=S.bills.reduce((s,b)=>s+due(b),0),fu=S.patients.filter(p=>p.fu&&p.fu<=add(t,7)).sort((a,b)=>a.fu>b.fu?1:-1);
$("#v-dash").innerHTML=(S.regs.length?`<div class="card"><b>${S.regs.length}</b> new online registration${S.regs.length>1?"s":""} waiting. ${btn("go","pat","Review")}</div>`:"")+`<div class="g" style="margin-bottom:16px"><div class="k"><b>${ap.length}</b><span>Appointments today</span></div><div class="k"><b>${M(col)}</b><span>Collected today</span></div><div class="k"><b>${M(dueT)}</b><span>Total outstanding</span></div><div class="k"><b>${fu.length}</b><span>Follow-ups due (7 days)</span></div></div><div class="card"><h2>Today’s appointments</h2><div class="tbl"><table>${rows(ap.map(a=>{const p=P(a.pid);return `<tr><td class="nw">${E(a.time||"–")}</td><td>${E(p.name)}<br><span class="mut">${E(a.note)}</span></td><td class="${a.st==="Done"?"ok":"mut"}">${a.st}</td><td class="r nw">${a.st==="Booked"?btn("done",a.id,"Done")+" ":""}${btn("rx",p.id,"Rx")} ${btn("bill",p.id,"Bill")}</td></tr>`}),"No appointments today")}</table></div></div><div class="card"><h2>Follow-ups due</h2><div class="tbl"><table>${rows(fu.map(p=>`<tr><td class="${p.fu<t?"bad":"warn"}">${fd(p.fu)}</td><td>${E(p.name)}<br><span class="mut">${E(p.ph)}</span></td><td class="r nw">${link(wa(p.ph,`Hello ${p.name}, your follow-up visit at ${clin()} is due on ${fd(p.fu)}. Please book a slot.`),"WhatsApp")} ${btn("book",p.id,"Book")} ${btn("fudone",p.id,"Clear")}</td></tr>`),"No follow-ups due")}</table></div></div>`};
R.appt=()=>{const v=$("#a-p").value;$("#a-p").innerHTML=psel();$("#a-p").value=v;if(!$("#a-d").value)$("#a-d").value=td();
$("#a-l").innerHTML=rows(S.appts.filter(a=>a.date>=td()).sort((a,b)=>(a.date+a.time)>(b.date+b.time)?1:-1).slice(0,60).map(a=>{const p=P(a.pid);return `<tr><td class="nw">${fd(a.date)} ${E(a.time)}</td><td>${E(p.name)}<br><span class="mut">${E(a.note)}</span></td><td class="${a.st==="Booked"?"":"mut"}">${a.st}</td><td class="r nw">${a.st==="Booked"?link(wa(p.ph,`Hello ${p.name}, this is a reminder of your appointment at ${clin()} on ${fd(a.date)}${a.time?" at "+a.time:""}.`),"Remind")+" "+btn("done",a.id,"Done")+" "+btn("cancel",a.id,"Cancel"):""}</td></tr>`}),"No upcoming appointments")};
R.pat=()=>{$("#rc").textContent=S.regs.length;$("#reg-l").innerHTML=rows(S.regs.map(r=>`<tr><td>${E(r.name)}<br><span class="mut">${E(r.age)} y / ${E(r.sex)} · ${E(r.ph)}</span></td><td class="r nw">${btn("ra",r.id,"Approve")} ${btn("rr",r.id,"Reject","x")}</td></tr>`),"No new registrations");const q=$("#p-q").value.toLowerCase();$("#pc").textContent=S.patients.length;$("#p-l").innerHTML=`<thead><tr><th>ID</th><th>Name</th><th>Age/Sex</th><th>Mobile</th></tr></thead>`+rows(S.patients.filter(p=>!q||(p.name+p.ph+p.id).toLowerCase().includes(q)).slice().reverse().map(p=>`<tr><td>${p.id}</td><td>${E(p.name)}</td><td>${E(p.age)}/${E(p.sex)}</td><td>${E(p.ph)}</td><td class="r nw">${btn("open",p.id,"Open")}</td></tr>`),"No patients yet")};
R.rx=()=>{const v=$("#x-p").value;$("#x-p").innerHTML=psel();$("#x-p").value=v;if(!$("#x-d").value)$("#x-d").value=td();if(!meds.length)meds=[{n:"",d:"",f:"",u:"",i:""}];rm();
$("#x-l").innerHTML=rows(S.rx.slice(-15).reverse().map(r=>`<tr><td>${r.no}</td><td>${fd(r.date)}</td><td>${E(P(r.pid).name)}</td><td class="r">${btn("vrx",r.no,"View / Print")}</td></tr>`),"None yet")};
const rm=()=>$("#x-m").innerHTML=meds.map((m,i)=>"<tr>"+["n","d","f","u","i"].map(k=>`<td><input data-g="m" data-i="${i}" data-k="${k}" value="${E(m[k])}" placeholder="${{n:"Tab Paracetamol 500mg",f:"1-0-1",u:"5 days",i:"After food"}[k]||""}"></td>`).join("")+`<td><button class="btn x" data-a="rmm" data-id="${i}">✕</button></td></tr>`).join("");
const calc=()=>{const s=items.reduce((a,i)=>a+(+i.q||0)*(+i.r||0),0),d=Math.min(+$("#b-ds").value||0,s);return{s,d,t:s-d}};
const ri=()=>{$("#b-i").innerHTML=items.map((it,i)=>`<tr><td><input data-g="i" data-i="${i}" data-k="n" value="${E(it.n)}" placeholder="e.g. Consultation"></td><td><input data-g="i" data-i="${i}" data-k="q" type="number" min="1" value="${it.q}"></td><td><input data-g="i" data-i="${i}" data-k="r" type="number" min="0" value="${E(it.r)}"></td><td class="r" id="am${i}">${M(it.q*it.r)}</td><td><button class="btn x" data-a="rmi" data-id="${i}">✕</button></td></tr>`).join("");$("#b-t").textContent=M(calc().t)};
R.bill=()=>{const v=$("#b-p").value;$("#b-p").innerHTML=psel();$("#b-p").value=v;if(!$("#b-d").value)$("#b-d").value=td();if(!items.length)items=[{n:"Consultation",q:1,r:""}];ri();
$("#b-l").innerHTML=`<thead><tr><th>No.</th><th>Date</th><th>Patient</th><th class="r">Total</th><th class="r">Due</th><th></th></tr></thead>`+rows(S.bills.slice(-20).reverse().map(b=>`<tr><td>${b.no}</td><td>${fd(b.date)}</td><td>${E(P(b.pid).name)}</td><td class="r">${M(b.t)}</td><td class="r ${due(b)>0?"bad":"ok"}">${due(b)>0?M(due(b)):"Paid"}</td><td class="r nw">${due(b)>0?`<input id="py${b.no}" type="number" min="0" style="width:90px" placeholder="₹"> ${btn("pay",b.no,"Collect")} `:""}${btn("vb",b.no,"View")}</td></tr>`),"None yet")};
R.rep=()=>{const [y,m]=td().split("-").map(Number),ms=[];for(let i=0;i<6;i++){const d=new Date(y,m-1-i,1);ms.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"))}
const od=S.bills.filter(b=>due(b)>0);
$("#v-rep").innerHTML=`<div class="card"><h2>Last 6 months</h2><div class="tbl"><table><thead><tr><th>Month</th><th class="r">Prescriptions</th><th class="r">Billed</th><th class="r">Collected</th></tr></thead>${ms.map(k=>`<tr><td>${k}</td><td class="r">${S.rx.filter(r=>r.date.startsWith(k)).length}</td><td class="r">${M(S.bills.filter(b=>b.date.startsWith(k)).reduce((s,b)=>s+b.t,0))}</td><td class="r">${M(S.bills.reduce((s,b)=>s+b.pays.filter(p=>p.d.startsWith(k)).reduce((x,p)=>x+p.a,0),0))}</td></tr>`).join("")}</table></div></div><div class="card"><h2>Outstanding payments</h2><div class="tbl"><table>${rows(od.map(b=>{const p=P(b.pid);return `<tr><td>${b.no}</td><td>${E(p.name)}</td><td class="bad r">${M(due(b))}</td><td class="r">${link(wa(p.ph,`Hello ${p.name}, a balance of ${M(due(b))} is pending for bill ${b.no} at ${clin()}. Thank you.`),"WhatsApp")}</td></tr>`}),"Nothing outstanding")}</table></div></div>`};
R.set=()=>{["name","doctor","qual","reg","phone","time","addr"].forEach(k=>$("#c-"+k).value=S.clinic[k]||"");ru()};

/* documents */
const dh=t=>`<div class="hd"><b>${E(clin())}</b><br>${dr()?E(dr())+(S.clinic.qual?", "+E(S.clinic.qual):""):""}${S.clinic.reg?"<br>Reg. No: "+E(S.clinic.reg):""}${S.clinic.addr?"<br>"+E(S.clinic.addr):""}${S.clinic.phone?"<br>Ph: "+E(S.clinic.phone):""}${S.clinic.time?"<br>"+E(S.clinic.time):""}</div><h3 style="text-align:center;margin:0 0 10px">${t}</h3>`;
const pl=(p,no,d)=>`<table><tr><td><b>${E(p.name)}</b>, ${E(p.age)} y / ${E(p.sex)}<br>ID: ${p.id} &nbsp; Mob: ${E(p.ph)}${p.al?"<br><b>Allergies:</b> "+E(p.al):""}</td><td class="r">${no}<br>Date: ${fd(d)}</td></tr></table>`;
function show(h,w){$("#doc").innerHTML=h;$("#o-w").classList.toggle("hide",!w);if(w)$("#o-w").href=w;$("#o-p").classList.toggle("hide",h.startsWith("<!--prof"));$("#ov").classList.remove("hide")}
const rxD=r=>{const p=P(r.pid),v=[["BP",r.bp],["Pulse",r.pu],["Temp",r.t],["Wt",r.w]].filter(x=>x[1]).map(x=>x[0]+": "+E(x[1])).join(" &nbsp; ");return dh("PRESCRIPTION")+pl(p,r.no,r.date)+(v?`<p>${v}</p>`:"")+(r.c?`<p><b>Complaints:</b> ${E(r.c)}</p>`:"")+(r.dx?`<p><b>Diagnosis:</b> ${E(r.dx)}</p>`:"")+`<div class="rx">℞</div><table><thead><tr><th>#</th><th>Medicine</th><th>Dose</th><th>Frequency</th><th>Duration</th><th>Instructions</th></tr></thead>${r.meds.map((m,i)=>`<tr><td>${i+1}</td><td>${E(m.n)}</td><td>${E(m.d)}</td><td>${E(m.f)}</td><td>${E(m.u)}</td><td>${E(m.i)}</td></tr>`).join("")}</table>${r.a?`<p><b>Advice:</b> ${E(r.a).replace(/\n/g,"<br>")}</p>`:""}${r.f?`<p><b>Follow-up:</b> ${fd(r.f)}</p>`:""}<div class="sig">${E(dr())||"Doctor’s signature"}</div>`};
const rxW=r=>wa(P(r.pid).ph,`*${clin()}*\nPrescription ${r.no} (${fd(r.date)})\nPatient: ${P(r.pid).name}\n${r.dx?"Diagnosis: "+r.dx+"\n":""}${r.meds.map((m,i)=>`${i+1}. ${m.n} ${m.d} ${m.f} ${m.u} ${m.i}`.replace(/ +/g," ")).join("\n")}${r.a?"\nAdvice: "+r.a:""}${r.f?"\nFollow-up: "+fd(r.f):""}`);
const bD=b=>{const p=P(b.pid),pd=paid(b);return dh("BILL / RECEIPT")+pl(p,b.no,b.date)+`<table style="margin-top:10px"><thead><tr><th>#</th><th>Service</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead>${b.items.map((i,k)=>`<tr><td>${k+1}</td><td>${E(i.n)}</td><td class="r">${i.q}</td><td class="r">${M(i.r)}</td><td class="r">${M(i.q*i.r)}</td></tr>`).join("")}</table><table style="margin-top:8px;max-width:320px;margin-left:auto"><tr><td>Subtotal</td><td class="r">${M(b.s)}</td></tr>${b.d?`<tr><td>Discount</td><td class="r">− ${M(b.d)}</td></tr>`:""}<tr><td><b>Total</b></td><td class="r"><b>${M(b.t)}</b></td></tr><tr><td>Received</td><td class="r">${M(pd)}</td></tr><tr><td><b>Balance due</b></td><td class="r"><b>${M(b.t-pd)}</b></td></tr></table><p style="font-size:12px;margin-top:26px">Payments: ${b.pays.map(x=>fd(x.d)+" "+M(x.a)+" ("+x.m+")").join("; ")||"none"}</p><div class="sig">Authorised signatory</div>`};
const bW=b=>wa(P(b.pid).ph,`*${clin()}*\nBill ${b.no} (${fd(b.date)})\n${b.items.map(i=>`${i.n} x${i.q}: ${M(i.q*i.r)}`).join("\n")}\nTotal: ${M(b.t)}\nReceived: ${M(paid(b))}\nBalance: ${M(due(b))}`);
const prof=id=>{const p=P(id),h=[...S.rx.filter(r=>r.pid===id).map(r=>[r.date,`Prescription ${r.no}${r.dx?" – "+E(r.dx):""}`,btn("vrx",r.no,"View")]),...S.bills.filter(b=>b.pid===id).map(b=>[b.date,`Bill ${b.no} – ${M(b.t)}${due(b)>0?` <span class="bad">(due ${M(due(b))})</span>`:""}`,btn("vb",b.no,"View")]),...S.appts.filter(a=>a.pid===id).map(a=>[a.date,`Appointment ${a.st}${a.note?" – "+E(a.note):""}`,""])].sort((a,b)=>a[0]<b[0]?1:-1);
show(`<!--prof--><h3 style="margin-top:0">${E(p.name)} <span class="mut">${p.id}</span></h3><p>${E(p.age)} y / ${E(p.sex)} · ${E(p.bg||"Unknown")} · ${E(p.ph)}${p.em?"<br>Contact: "+E(p.em):""}${p.ad?"<br>"+E(p.ad):""}${p.al?`<br><b>Allergies:</b> ${E(p.al)}`:""}${p.hx?`<br><b>History:</b> ${E(p.hx)}`:""}${p.fu?`<br><b>Follow-up:</b> ${fd(p.fu)}`:""}</p><div class="row" style="margin:0 0 12px">${btn("edit",id,"Edit")} ${btn("rx",id,"New Rx")} ${btn("bill",id,"New bill")} ${btn("book",id,"Book")}</div><h4>History</h4><table>${rows(h.map(x=>`<tr><td class="nw">${fd(x[0])}</td><td>${x[1]}</td><td class="r">${x[2]}</td></tr>`),"No visits yet")}</table>`)};
const toCsv=a=>a.map(r=>r.map(c=>`"${String(c??"").replace(/"/g,'""')}"`).join(",")).join("\n");
async function dl(name,txt,type){try{const d=await claude.use("downloads");if(!d)return flash("Download not available in this view");await d.save({filename:name,data:new Blob([txt],{type})})}catch(e){flash("File was not saved")}}

/* events */
$("#o-x").onclick=()=>$("#ov").classList.add("hide");
$("#o-p").onclick=()=>{try{print()}catch(e){alert("Printing is not available here. Open the page in a full browser tab.")}};
const chosen=(v,sid,id)=>{go(v);$(sid).value=id;$("#ov").classList.add("hide")};
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.g==="m")meds[t.dataset.i][t.dataset.k]=t.value;else if(t.dataset.g==="i"){const it=items[t.dataset.i];it[t.dataset.k]=t.value;$("#am"+t.dataset.i).textContent=M(it.q*it.r);$("#b-t").textContent=M(calc().t)}else if(t.id==="b-ds")$("#b-t").textContent=M(calc().t);else if(t.id==="p-q")R.pat()});
document.addEventListener("click",async e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id;
 if(a==="open")prof(id);
 else if(a==="edit"){const p=P(id);eid=id;["name","age","sex","ph","bg","em","ad","al","hx"].forEach(k=>$("#p-"+k).value=p[k]||"");$("#pt").textContent="Edit patient "+id;$("#p-c").classList.remove("hide");$("#ov").classList.add("hide");go("pat")}
 else if(a==="rx")chosen("rx","#x-p",id);else if(a==="bill")chosen("bill","#b-p",id);else if(a==="book")chosen("appt","#a-p",id);
 else if(a==="done"||a==="cancel"){const x=S.appts.find(z=>z.id==id);x.st=a==="done"?"Done":"Cancelled";await put("appts",x);go(cur())}
 else if(a==="fudone"){delete P(id).fu;await put("patients",P(id));R.dash()}
 else if(a==="addm"){meds.push({n:"",d:"",f:"",u:"",i:""});rm()}else if(a==="rmm"){meds.splice(id,1);rm()}
 else if(a==="addi"){items.push({n:"",q:1,r:""});ri()}else if(a==="rmi"){items.splice(id,1);ri()}
 else if(a==="vrx"){const r=S.rx.find(z=>z.no===id);show(rxD(r),rxW(r))}else if(a==="vb"){const b=S.bills.find(z=>z.no===id);show(bD(b),bW(b))}
 else if(a==="pay"){const b=S.bills.find(z=>z.no===id),v=Math.min(+$("#py"+id).value||0,due(b));if(v<=0)return flash("Enter an amount to collect");b.pays.push({d:td(),a:v,m:"Cash"});await put("bills",b);R.bill();flash("Payment recorded")}
 else if(a==="go")go(id);else if(a==="ra"){const d=await api("POST",`/api/registrations/${id}/approve`);S.patients.push(d);S.regs=S.regs.filter(x=>x.id!=id);R.pat();flash("Patient added: "+d.id)}else if(a==="rr"){await api("DELETE",`/api/registrations/${id}`);S.regs=S.regs.filter(x=>x.id!=id);R.pat()}else if(a==="pc")chPass();else if(a==="adu")addUser();else if(a==="rmu"){await api("DELETE",`/api/users/${id}`);S.users=S.users.filter(x=>x.id!=id);ru()}else if(a==="qr")qrPoster();else if(a==="bk")dl("opd-desk-backup-"+td()+".json",JSON.stringify(S),"application/json");
 else if(a==="csvp")dl("patients.csv",toCsv([["ID","Name","Age","Sex","Mobile","Blood group","Address","Allergies","Registered"],...S.patients.map(p=>[p.id,p.name,p.age,p.sex,p.ph,p.bg,p.ad,p.al,p.date])]),"text/csv");
 else if(a==="csvb")dl("bills.csv",toCsv([["Bill","Date","Patient ID","Patient","Total","Received","Due"],...S.bills.map(b=>[b.no,b.date,b.pid,P(b.pid).name,b.t,paid(b),due(b)])]),"text/csv")});
const cur=()=>V.find(v=>!$("#v-"+v).classList.contains("hide"));
const resetP=()=>{eid=null;["name","age","ph","em","ad","al","hx"].forEach(k=>$("#p-"+k).value="");$("#p-sex").value="Male";$("#p-bg").value="Unknown";$("#pt").textContent="Register new patient";$("#p-c").classList.add("hide")};
$("#p-c").onclick=resetP;
$("#p-s").onclick=async()=>{const o={};["name","age","sex","ph","bg","em","ad","al","hx"].forEach(k=>o[k]=$("#p-"+k).value.trim());if(!o.name||!o.age||!/^[6-9]\d{9}$/.test(o.ph))return flash("Enter name, age and a valid 10-digit mobile number");
 if(eid){Object.assign(P(eid),o);await put("patients",P(eid))}else{o.date=td();S.patients.push(await api("POST","/api/patients",o))}flash("Patient saved");resetP();R.pat()};
$("#a-s").onclick=async()=>{const pid=$("#a-p").value,d=$("#a-d").value;if(!pid||!d)return flash("Select a patient and a date");S.appts.push(await api("POST","/api/appts",{pid,date:d,time:$("#a-t").value,note:$("#a-n").value,st:"Booked"}));$("#a-n").value="";flash("Appointment booked");R.appt()};
$("#x-s").onclick=async()=>{const pid=$("#x-p").value,ms=meds.filter(m=>m.n.trim());if(!pid||!ms.length)return flash("Select a patient and add at least one medicine");
 const g=k=>$("#x-"+k).value,r={pid,date:g("d")||td(),bp:g("bp"),pu:g("pu"),t:g("t"),w:g("w"),c:g("c"),dx:g("dx"),a:g("a"),f:g("f"),meds:ms};Object.assign(r,await api("POST","/api/rx",r));S.rx.push(r);if(r.f)P(pid).fu=r.f;else delete P(pid).fu;await put("patients",P(pid));
 ["bp","pu","t","w","c","dx","a","f"].forEach(k=>$("#x-"+k).value="");meds=[];R.rx();show(rxD(r),rxW(r))};
$("#b-s").onclick=async()=>{const pid=$("#b-p").value,its=items.filter(i=>i.n.trim()&&i.r!=="").map(i=>({n:i.n,q:+i.q||1,r:+i.r}));if(!pid||!its.length)return flash("Select a patient and add a priced item");
 const s=its.reduce((a,i)=>a+i.q*i.r,0),d=Math.min(+$("#b-ds").value||0,s),t=s-d,rc=$("#b-r").value===""?t:Math.min(+$("#b-r").value,t),dt=$("#b-d").value||td();
 const b={pid,date:dt,items:its,s,d,t,pays:rc>0?[{d:dt,a:rc,m:$("#b-m").value}]:[]};Object.assign(b,await api("POST","/api/bills",b));S.bills.push(b);items=[];$("#b-ds").value=0;$("#b-r").value="";R.bill();show(bD(b),bW(b))};
$("#c-s").onclick=async()=>{const o={};["name","doctor","qual","reg","phone","time","addr"].forEach(k=>o[k]=$("#c-"+k).value.trim());S.clinic=await api("PUT","/api/clinic",o);go("set");flash("Details saved")};

function qrSvg(t){const q=qrcode(0,"M");q.addData(t);q.make();const n=q.getModuleCount(),m=4;let d="";for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+m},${r+m}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*m} ${n+2*m}" width="300" height="300" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`}
function qrPoster(){if(!S.clinic.name)return flash("Save your clinic name in Settings first");if(typeof qrcode==="undefined")return flash("QR library could not load");show(`<div style="text-align:center"><h2 style="margin:0">${E(clin())}</h2>${dr()?`<p style="margin:4px 0">${E(dr())}</p>`:""}<h3>Scan to register as a new patient</h3>${qrSvg(location.origin+"/register")}<p style="font-size:13px">Point your phone camera at the code and fill in your details. Please tell the front desk when you arrive.</p></div>`)}
const ru=()=>{const c=$("#usr");if(!c||!ME)return;c.classList.toggle("hide",ME.role!=="doctor");$("#u-l").innerHTML=rows(S.users.map(u=>`<tr><td>${E(u.name)}<br><span class="mut">${E(u.username)}</span></td><td>${u.role}</td><td class="r">${u.id===ME.id?"":btn("rmu",u.id,"Remove","x")}</td></tr>`),"No users")};
async function addUser(){const u=await api("POST","/api/users",{username:$("#u-n").value,name:$("#u-f").value,role:$("#u-r").value,password:$("#u-p").value});S.users.push(u);["n","f","p"].forEach(k=>$("#u-"+k).value="");ru();flash("User added")}
async function chPass(){await api("POST","/api/password",{current:$("#pc-c").value,next:$("#pc-n").value});$("#pc-c").value=$("#pc-n").value="";flash("Password changed")}
let IT;const rst=()=>{clearTimeout(IT);IT=setTimeout(out,9e5)},idle=()=>{["click","keydown","touchstart"].forEach(t=>document.addEventListener(t,rst,{passive:true}));rst()};
async function out(){try{await api("POST","/api/logout")}catch(e){}ME=null;location.reload()}
$("#lockb").onclick=out;
async function enter(){const d=await api("GET","/api/data");S={...S,...d};ME=d.me;document.querySelectorAll('#nav button[data-v="rx"]').forEach(b=>b.classList.toggle("hide",ME.role!=="doctor"));$("#lk").classList.remove("on");document.body.classList.remove("lk");idle();go("dash")}
async function boot(){const st=await api("GET","/api/status");if(st.me)return enter();const L=$("#lk"),su=st.setup;
 L.innerHTML=`<div class="card"><h2>${su?"Set up OPD Desk":"Staff sign-in"}</h2><p class="mut" style="margin-top:0">${su?"Create the first doctor account. Choose a strong password of 8+ characters.":"OPD Desk is for clinic staff only."}</p><label>Username</label><input id="l-u" autocomplete="username" autocapitalize="none">${su?`<label style="margin-top:10px">Your name</label><input id="l-n">`:""}<label style="margin-top:10px">Password</label><input id="l-p" type="password" autocomplete="${su?"new-password":"current-password"}"><p id="l-m" class="bad"></p><button class="btn" id="l-go">${su?"Create account":"Sign in"}</button></div>`;L.classList.add("on");
 const go1=async()=>{$("#l-m").textContent="";try{await api("POST",su?"/api/setup":"/api/login",{username:$("#l-u").value,name:su?$("#l-n").value:undefined,password:$("#l-p").value});await enter()}catch(e){$("#l-m").textContent=e.message}};
 $("#l-go").onclick=go1;L.onkeydown=e=>{if(e.key==="Enter")go1()};$("#l-u").focus()}
boot().catch(e=>{$("#lk").innerHTML=`<div class="card"><h2>Cannot reach the server</h2><p>${E(e.message)}</p></div>`;$("#lk").classList.add("on")});
</script></body></html>
