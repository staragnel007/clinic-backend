<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Patient registration</title>
<style>:root{--bg:#f3f6f4;--card:#fff;--ink:#17261f;--mut:#667a70;--line:#dce5e0;--pri:#1f7a52;--pi:#fff;--bad:#b3261e}@media(prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#18231d;--ink:#e6efe9;--mut:#93a89c;--line:#2a3a31;--pri:#47b583;--pi:#06210f;--bad:#f2837c;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}h1{font-size:20px;margin:0 0 2px}h2{font-size:15px;margin:20px 0 0;padding-top:12px;border-top:1px solid var(--line)}p{margin:0 0 12px;color:var(--mut)}label{display:block;font-size:12px;color:var(--mut);margin:12px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}textarea{min-height:56px}
button{margin-top:16px;width:100%;background:var(--pri);color:var(--pi);border:0;padding:11px;border-radius:6px;font:inherit;font-weight:600;cursor:pointer}button:disabled{opacity:.6}.bad{color:var(--bad)}.c{display:flex;gap:8px;font-size:13px;color:var(--ink);align-items:flex-start}.c input{width:auto;margin-top:3px}.h{position:absolute;left:-9999px}
#sg{width:100%;height:160px;background:#fff;border:1px solid var(--line);border-radius:6px;touch-action:none;display:block}.lnk{width:auto;margin:6px 0 0;padding:0;background:none;color:var(--pri);font-weight:500}</style></head><body><main><div class="card" id="f">
<h1>{{CLINIC}}</h1><p>New patient registration</p><div id="fm" class="mut">Loading…</div>
<input class="h" id="website" tabindex="-1" autocomplete="off" aria-hidden="true">
<label class="c"><input type="checkbox" id="ok">I agree to share these details with the clinic for my treatment.</label>
<p id="m" class="bad" style="margin:10px 0 0"></p><button id="go" disabled>Submit registration</button></div>
<div class="card" id="done" style="display:none"><h1>Thank you</h1><p>Your details have been sent to {{CLINIC}}. Please tell the front desk when you arrive.</p></div></main>
<script>
const $=i=>document.getElementById(i),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));let FORM=null,signed=false;
const fld=f=>{const id="f_"+f.id,L=`<label>${esc(f.l)}${f.r?" *":""}</label>`;
 if(f.y==="textarea")return L+`<textarea id="${id}"></textarea>`;
 if(f.y==="select")return L+`<select id="${id}">${(f.r?[]:[""]).concat(f.o||[]).map(o=>`<option value="${esc(o)}">${esc(o)||"Select"}</option>`).join("")}</select>`;
 const ty={number:"number",phone:"tel",date:"date"}[f.y]||"text";return L+`<input id="${id}" type="${ty}"${f.y==="phone"?' maxlength="10" inputmode="numeric"':""}${f.id==="age"?' min="0" max="120" inputmode="numeric"':""}>`};
function sign(){const c=$("sg"),x=c.getContext("2d");x.lineWidth=2.5;x.lineCap="round";x.strokeStyle="#000";let d=false;
 const pt=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);const[a,b]=pt(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke()};
 c.onpointermove=e=>{if(!d)return;const[a,b]=pt(e);x.lineTo(a,b);x.stroke();signed=true};c.onpointerup=c.onpointercancel=()=>{d=false;signed=true};
 $("sgc").onclick=()=>{x.clearRect(0,0,c.width,c.height);signed=false}}
fetch("/api/public/form").then(r=>r.json()).then(j=>{FORM=j.form;$("fm").className="";$("fm").innerHTML=FORM.sections.map(s=>`<h2>${esc(s.t)}</h2>`+s.f.map(fld).join("")).join("")+(FORM.sig?`<h2>Signature *</h2><canvas id="sg" width="460" height="160"></canvas><button type="button" class="lnk" id="sgc">Clear signature</button>`:"");if(FORM.sig)sign();$("go").disabled=false}).catch(()=>{$("fm").textContent="Could not load the form. Please refresh the page."});
$("go").onclick=async()=>{const m=$("m");m.textContent="";const b={website:$("website").value,consent:$("ok").checked};
 for(const s of FORM.sections)for(const f of s.f){const v=$("f_"+f.id).value.trim();b[f.id]=v;if(f.r&&!v){m.textContent="Please fill in: "+f.l;return}}
 if(!/^[6-9]\d{9}$/.test(b.ph||"")){m.textContent="Please enter a valid 10-digit mobile number.";return}
 if(FORM.sig){if(!signed){m.textContent="Please sign in the box.";return}b.sig=$("sg").toDataURL("image/png")}
 if(!b.consent){m.textContent="Please tick the consent box.";return}
 $("go").disabled=true;try{const r=await fetch("/api/public/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)throw new Error(j.error);$("f").style.display="none";$("done").style.display="block"}catch(e){m.textContent=e.message||"Could not submit. Please try again.";$("go").disabled=false}};
</script></body></html>
